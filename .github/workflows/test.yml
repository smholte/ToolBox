# Every push: the app's tests on Linux (under a virtual screen), and on Windows the installer built, installed,
# started, tested and uninstalled (task 0004); the Toolbox folder and its adapter on both (task 0005).
name: test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r tools/requirements.txt
      - name: Icons up to date
        run: python3 tools/make_icons.py --check
      - name: Tests (units, texts, the Toolbox folder, the app under a virtual screen)
        run: xvfb-run -a npm test

  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install jsonschema==4.26.0
      - name: Unit, text and Toolbox-folder tests (a file held open, a junction)
        run: node --test --test-concurrency=1 tests/units.test.js tests/texts.test.js tests/folder.test.js
      - name: Build the installer
        run: npm run dist
      - name: Install, start, test, uninstall
        shell: pwsh
        run: ./tests/windows/install-test.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer
          path: dist/*.exe
          retention-days: 14
